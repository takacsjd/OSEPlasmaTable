part_id: PART-SLAT
name: Shark-tooth slat bar
status: active
role: workpiece_support
description: 'Long steel bar running in Y, perpendicular to runners. Shark-tooth V-profile on the top
  edge: narrow V-teeth create point contact with the workpiece so water stays below the cut zone and dross
  falls through. Body drops through runner slits; runner captures from below.

  '
material: steel
coordinate_convention: 'Local: Y along bar, X width, Z height. Assembly: X offset per instance'
