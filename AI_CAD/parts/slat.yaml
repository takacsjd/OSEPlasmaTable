    unit: mm
    constraint_id: CON-SLAT-WIDTH
    note: 1.5 mm sheet-metal blade (was 30 mm solid bar); this X-thickness passes through the runner slit
  body_bottom:
    value: 55
    unit: mm
    note: Slat body bottom (matches runner bottom)
  body_top:
    value: 95
    unit: mm
    note: Slat body top (sits on runner top)
  tooth_height:
    value: 17
    unit: mm
    note: V-tooth band height; tips at 95 + 17 = 112
  tooth_pitch:
    value: 50
    unit: mm
    constraint_id: CON-SLAT-PITCH
    note: Peak-to-peak along Y
