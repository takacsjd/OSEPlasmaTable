# RESPONSIBILITY SPLIT — who provides what (user spec 2026-10-27)
# This governs design decisions: everything on the SITE side must be
# design-around (fixed interfaces); everything on the USER side is ours
# to design and open source.

provided_by_user:
  - actuators              # motors for X/Y/Z motion
  - motor_controls         # drivers / FOC / stepper electronics
  - system_control         # controller, firmware, real-time THC, G-code path
note_user: >
  The control stack is the open-source target of this project
  (real-time THC, local control not dependent on the PC).
  Design must expose clean interfaces: axis signals, limit/endstop inputs,
  THCAD in/out, torch enable, arc-sense.

provided_by_site:
  - metal                  # structural steel for frame/gantry as required
  - lead_screws            # site-supplied; with XY on rack & pinion,
                           # leadscrews apply to Z / other drives
  - other_mechanical       # "metal etc required" — site sources hardware
  - plasma_source          # Hypertherm Powermax 65 + Duramax 180 machine torch
  - air_source             # compressed air / gas supply
  - thc_instrumentation    # torch height control voltage measurement (arc sense)

confirmed_decisions:
  - id: DEC-TORCH-BRAND
    decision: >
      Torch is Hypertherm: Powermax 65, Duramax 180 full-length machine torch,
      CPC port, 32-pitch gear rack (MRT, P/N 228738), cap sensor for breakaway.
    status: confirmed
    date: 2026-10-27
    reference: drawings/powermax65_cnc_torch_spec.md
  - id: DEC-XY-DRIVE
    decision: "XY gantry drives are rack & pinion (both axes)"
    status: confirmed
    date: 2026-10-27
    reference: calc/axis-sizing.md
  - id: DEC-BED-LIFT
    decision: >
      Bed raise/lower is the cable/pulley + counterweight system
      (manual assist; positive locking pins are the safety device).
    status: confirmed
    date: 2026-10-27

design_implications:
  - >
    XY axes drive by rack & pinion: pinion on the carriage, full-length rack
    on the frame. Motor + pinion geometry must be parametric per site rack
    pitch/teeth; do not hardcode module or tooth count.
  - >
    Lead screw pitches are NOT ours to choose; with rack & pinion on XY the
    leadscrews apply to Z / other drives -> steps/mm must be parameterized
    per site, not hardcoded.
  - >
    THC front-end (Mesa THCAD-10) consumes the site's arc-sense voltage;
    our firmware owns the closed loop on top of it.
  - >
    Frame/gantry geometry must tolerate site-sourced metal tolerances;
    keep interfaces bolted, not welded-precise, where practical.
  - >
    Air source and plasma source are fixed: no design may assume different
    power/amperage characteristics than Hypertherm Powermax 65 + site air.
  - >
    Bed lift: cable/pulley + counterweight assists the heavy water bed;
    locking pins remain the sole reliable support at rest.

provenance:
  source: User spec 2026-10-27
  status: confirmed
